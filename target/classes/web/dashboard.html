<!doctype html>
<html lang="nl">
  <head>
<link rel="stylesheet" href="/web/design-system.css">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PlugModCore — Dashboard</title>
    <link rel="stylesheet" href="/web/styles.css">
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <h2>Navigation</h2>
        <button id="navHome">Home</button>
        <div id="moduleList"></div>
      </aside>

      <main class="content">
        <div class="greeting" id="greeting"></div>

        <section id="homeView">
          <div class="center">
            <div class="title">Upload Modules</div>
            <div class="upload-box">
              <input type="file" multiple id="fileInput" aria-label="Module JAR files"><br>
              <button class="btn blue" id="uploadBtn">Upload</button>
            </div>
          </div>
          <div class="modules" id="modules"></div>
        </section>

        <section id="moduleView" class="hidden">
          <div class="topbar" id="moduleTopbar"></div>
          <div class="module-content" id="moduleContent">
            <iframe id="moduleFrame" title="Module site" src="about:blank" frameborder="0"></iframe>
          </div>
        </section>
      </main>
    </div>

    <!-- Toast container -->
    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <!-- Confirmation modal (used by future JS modal replacement) -->
    <div id="confirmModal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="confirmMessage">
      <div class="modal">
        <div id="confirmMessage"></div>
        <div class="modal-actions">
          <button id="confirmCancel" class="btn gray">Annuleer</button>
          <button id="confirmOk" class="btn red">Verwijder</button>
        </div>
      </div>
    </div>

    <script src="/web/dashboard.js"></script>
  </body>
</html>
